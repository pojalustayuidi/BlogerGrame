name: blogergrame
description: "Game BloggerGame"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.8
  riverpod_lint: ^2.3.10
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Keep legacy flat assets because existing screens still depend on them.
    - assets/
    # Nested directories from Prufani Asset Kit v1.1.
    - assets/prufani/backgrounds/
    - assets/prufani/brand/
    - assets/prufani/decor/
    - assets/prufani/illustrations/
    - assets/prufani/loading/
    - assets/prufani/icons/categories/
    - assets/prufani/icons/features/
    - assets/prufani/icons/navigation/
    - assets/prufani/icons/resources/
    - assets/prufani/icons/results/
    - assets/prufani/ui/
  fonts:
    - family: baloo
      fonts:
        - asset: assets/fonts/baloo-regular.ttf
    - family: Franklin
      fonts:
        - asset: assets/fonts/franklin gothic_demi.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ava3.png"
